<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduForum — แผงควบคุมผู้ดูแลระบบ</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/config.js"></script>
<style>
  body { font-family: 'Sarabun', 'Be Vietnam Pro', sans-serif; }
  :focus-visible { outline: 2px solid #006a6a; outline-offset: 2px; }
</style>
</head>
<body class="bg-surface text-on-surface">

<div id="site-header"></div>

<div id="gate" class="max-w-md mx-auto px-5 py-xl text-center">
  <p class="text-body-lg mb-3">หน้านี้สำหรับผู้ดูแลระบบเท่านั้น</p>
  <a href="login.html?next=admin.html" class="inline-block px-5 py-3 rounded-lg bg-primary-container text-on-primary text-label-md">เข้าสู่ระบบผู้ดูแล</a>
</div>

<main id="panel" class="hidden max-w-container mx-auto px-5 py-lg">
  <h1 class="font-display text-title-lg text-primary mb-lg">ภาพรวมระบบประจำวัน</h1>

  <!-- การ์ดสถิติ -->
  <section id="stat-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-md mb-lg"></section>

  <!-- กราฟ 7 วัน -->
  <section class="bg-surface-container-lowest border border-outline-variant rounded p-md mb-lg">
    <h2 class="font-display text-title-lg mb-md">ความเคลื่อนไหว 7 วันล่าสุด</h2>
    <div id="chart" class="flex items-end gap-2 h-40"></div>
  </section>

  <!-- แท็บ -->
  <nav class="flex gap-1 border-b border-outline-variant mb-md overflow-x-auto">
    <button data-tab="queue" class="tab px-4 py-3 text-label-md whitespace-nowrap">รายการรอตรวจสอบ</button>
    <button data-tab="users" class="tab px-4 py-3 text-label-md whitespace-nowrap">สมาชิก</button>
    <button data-tab="settings" class="tab px-4 py-3 text-label-md whitespace-nowrap">ตั้งค่าระบบ</button>
  </nav>

  <section id="tab-queue">
    <h2 class="font-display text-title-lg mb-md">รายการโพสต์ที่ถูกรายงาน (Review Queue)</h2>
    <div id="reports" class="flex flex-col gap-3 mb-lg"></div>
    <h2 class="font-display text-title-lg mb-md">โพสต์รออนุมัติ</h2>
    <div id="pending" class="flex flex-col gap-3"></div>
  </section>

  <section id="tab-users" class="hidden">
    <input id="user-search" placeholder="ค้นหาชื่อผู้ใช้…"
           class="w-full sm:w-80 h-11 px-3 mb-md rounded border border-outline-variant bg-surface-container-lowest text-body-md focus:border-secondary focus:outline-none">
    <div class="overflow-x-auto bg-surface-container-lowest border border-outline-variant rounded">
      <table class="w-full text-label-md">
        <thead class="bg-surface-container text-on-surface-variant">
          <tr><th class="text-left p-3">ชื่อผู้ใช้</th><th class="text-left p-3">ชื่อที่แสดง</th><th class="text-left p-3">บทบาท</th><th class="text-left p-3">โพสต์</th><th class="text-left p-3">สถานะ</th><th class="p-3"></th></tr>
        </thead>
        <tbody id="user-rows"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-settings" class="hidden">
    <div id="config-rows" class="flex flex-col gap-3 max-w-2xl"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/app.js"></script>
<script>
(function () {
  EF.renderHeader(''); EF.renderFooter();
  if (!EF.Auth.isAdmin()) return;
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');

  // ---------- แท็บ ----------
  var on = 'tab px-4 py-3 text-label-md whitespace-nowrap border-b-2 border-secondary text-primary font-semibold';
  var off = 'tab px-4 py-3 text-label-md whitespace-nowrap border-b-2 border-transparent text-on-surface-variant';
  function switchTab(name) {
    ['queue', 'users', 'settings'].forEach(function (t) {
      document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
      document.querySelector('[data-tab="' + t + '"]').className = t === name ? on : off;
    });
    if (name === 'users') loadUsers('');
    if (name === 'settings') loadConfig();
  }
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { switchTab(b.dataset.tab); });
  });
  switchTab('queue');

  // ---------- สถิติ ----------
  function card(label, value, icon, tone) {
    return '<div class="bg-surface-container-lowest border border-outline-variant rounded p-md">' +
      '<div class="flex items-center justify-between mb-2">' +
        '<span class="text-label-md text-on-surface-variant">' + label + '</span>' +
        '<span class="material-symbols-outlined text-[20px] ' + tone + '">' + icon + '</span>' +
      '</div>' +
      '<p class="font-display text-headline-lg text-primary">' + value + '</p></div>';
  }

  function loadStats() {
    EF.api.post('admin.stats', {}).then(function (r) {
      if (!r.ok) return EF.toast(r.error, 'error');
      var s = r.stats;
      document.getElementById('stat-cards').innerHTML =
        card('กระทู้ใหม่วันนี้', s.newThreadsToday, 'forum', 'text-secondary') +
        card('ความเห็นวันนี้', s.newRepliesToday, 'chat', 'text-secondary') +
        card('รอตรวจสอบ', s.pendingReports + s.pendingPosts, 'flag', 'text-error') +
        card('สมาชิกทั้งหมด', s.totalUsers, 'group', 'text-primary-container');

      var max = Math.max(1, Math.max.apply(null, r.series.map(function (d) { return d.threads + d.replies; })));
      document.getElementById('chart').innerHTML = r.series.map(function (d) {
        var h = Math.round(((d.threads + d.replies) / max) * 100);
        var day = new Date(d.date).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
        return '<div class="flex-1 flex flex-col items-center justify-end gap-1 h-full">' +
          '<span class="text-label-sm text-outline">' + (d.threads + d.replies) + '</span>' +
          '<div class="w-full rounded-t bg-primary-container" style="height:' + Math.max(h, 2) + '%" title="' + day + '"></div>' +
          '<span class="text-label-sm text-outline">' + day + '</span></div>';
      }).join('');
    }).catch(function (e) { EF.toast(e.message, 'error'); });
  }

  // ---------- คิวตรวจสอบ ----------
  function loadQueue() {
    EF.api.post('admin.reports', { status: 'pending' }).then(function (r) {
      if (!r.ok) return EF.toast(r.error, 'error');

      document.getElementById('reports').innerHTML = r.reports.length ? r.reports.map(function (x) {
        return '<div class="bg-surface-container-lowest border border-outline-variant rounded p-md">' +
          '<div class="flex items-start justify-between gap-3 flex-wrap">' +
            '<div class="min-w-0">' +
              '<p class="text-label-md text-on-surface font-semibold break-words">' + EF.esc(x.targetTitle) + '</p>' +
              '<p class="text-label-sm text-outline mt-1">โดย ' + EF.esc(x.authorName) + ' · ' + EF.timeAgo(x.createdAt) + ' · เหตุผล: ' + EF.esc(x.reason) + '</p>' +
              '<p class="text-body-md text-on-surface-variant mt-2 line-clamp-3">' + EF.esc(x.snippet) + '</p>' +
            '</div>' +
            '<div class="flex gap-2 shrink-0">' +
              '<a href="thread.html?id=' + encodeURIComponent(x.targetType === 'thread' ? x.targetId : '') + '" class="px-3 py-2 rounded-lg text-label-sm border border-outline-variant hover:border-secondary">ดู</a>' +
              '<button data-mod="keep" data-id="' + x.id + '" class="px-3 py-2 rounded-lg text-label-sm border border-outline-variant hover:border-secondary">เก็บไว้</button>' +
              '<button data-mod="hide" data-id="' + x.id + '" class="px-3 py-2 rounded-lg text-label-sm bg-warning text-white">ซ่อน</button>' +
              '<button data-mod="delete" data-id="' + x.id + '" class="px-3 py-2 rounded-lg text-label-sm bg-error text-on-error">ลบ</button>' +
            '</div>' +
          '</div></div>';
      }).join('') : '<p class="text-body-md text-on-surface-variant">ไม่มีรายงานค้างอยู่</p>';

      document.getElementById('pending').innerHTML = r.pending.length ? r.pending.map(function (x) {
        return '<div class="bg-surface-container-lowest border border-outline-variant rounded p-md flex items-start justify-between gap-3 flex-wrap">' +
          '<div class="min-w-0"><p class="text-label-md font-semibold break-words">' + EF.esc(x.title) + '</p>' +
          '<p class="text-label-sm text-outline mt-1">' + EF.esc(x.authorName) + ' · ' + EF.timeAgo(x.createdAt) + '</p>' +
          '<p class="text-body-md text-on-surface-variant mt-2 line-clamp-3">' + EF.esc(x.body) + '</p></div>' +
          '<div class="flex gap-2 shrink-0">' +
            '<button data-approve="' + x.id + '" data-type="' + x.type + '" class="px-3 py-2 rounded-lg text-label-sm bg-secondary text-on-secondary">อนุมัติ</button>' +
            '<button data-reject="' + x.id + '" data-type="' + x.type + '" class="px-3 py-2 rounded-lg text-label-sm border border-outline-variant hover:border-error hover:text-error">ไม่อนุมัติ</button>' +
          '</div></div>';
      }).join('') : '<p class="text-body-md text-on-surface-variant">ไม่มีโพสต์รออนุมัติ</p>';
    });
  }

  document.addEventListener('click', function (e) {
    var mod = e.target.closest('[data-mod]');
    if (mod) {
      if (mod.dataset.mod === 'delete' && !confirm('ยืนยันลบเนื้อหานี้ออกจากเว็บบอร์ด?\n\nเนื้อหาจะถูกทำเครื่องหมายว่าลบและไม่แสดงบนหน้าเว็บ ข้อมูลยังคงอยู่ในชีต Threads/Replies')) return;
      EF.api.post('admin.moderate', { reportId: mod.dataset.id, decision: mod.dataset.mod })
        .then(function (r) { if (r.ok) { EF.toast('ดำเนินการแล้ว'); loadQueue(); loadStats(); } else EF.toast(r.error, 'error'); });
      return;
    }
    var ap = e.target.closest('[data-approve]');
    if (ap) {
      EF.api.post('admin.setStatus', { targetType: ap.dataset.type, targetId: ap.dataset.approve, status: 'active' })
        .then(function (r) { if (r.ok) { EF.toast('อนุมัติแล้ว'); loadQueue(); loadStats(); } });
      return;
    }
    var rj = e.target.closest('[data-reject]');
    if (rj) {
      EF.api.post('admin.setStatus', { targetType: rj.dataset.type, targetId: rj.dataset.reject, status: 'hidden' })
        .then(function (r) { if (r.ok) { EF.toast('ไม่อนุมัติแล้ว'); loadQueue(); } });
      return;
    }
    var role = e.target.closest('[data-role-user]');
    if (role) {
      EF.api.post('admin.setRole', { userId: role.dataset.roleUser, role: role.dataset.role })
        .then(function (r) { if (r.ok) { EF.toast('ปรับบทบาทแล้ว'); loadUsers(document.getElementById('user-search').value); } });
    }
  });

  // ---------- สมาชิก ----------
  function loadUsers(q) {
    EF.api.post('admin.users', { q: q }).then(function (r) {
      if (!r.ok) return EF.toast(r.error, 'error');
      var roleTh = { admin: 'ผู้ดูแล', teacher: 'ครู', student: 'นักเรียน' };
      document.getElementById('user-rows').innerHTML = r.users.map(function (u) {
        var nextRole = u.role === 'admin' ? 'student' : 'admin';
        return '<tr class="border-t border-outline-variant">' +
          '<td class="p-3">' + EF.esc(u.username) + '</td>' +
          '<td class="p-3">' + EF.esc(u.displayName) + '</td>' +
          '<td class="p-3">' + (roleTh[u.role] || u.role) + '</td>' +
          '<td class="p-3">' + (u.postCount || 0) + '</td>' +
          '<td class="p-3">' + (u.status === 'active' ? 'ใช้งาน' : 'ระงับ') + '</td>' +
          '<td class="p-3 text-right"><button data-role-user="' + u.id + '" data-role="' + nextRole + '" class="text-label-sm text-secondary hover:underline">' +
            (u.role === 'admin' ? 'ถอดสิทธิ์ผู้ดูแล' : 'ตั้งเป็นผู้ดูแล') + '</button></td></tr>';
      }).join('');
    });
  }
  var t;
  document.getElementById('user-search').addEventListener('input', function (e) {
    clearTimeout(t); var v = e.target.value; t = setTimeout(function () { loadUsers(v); }, 350);
  });

  // ---------- ตั้งค่า ----------
  function loadConfig() {
    EF.api.post('admin.config', { mode: 'list' }).then(function (r) {
      if (!r.ok) return EF.toast(r.error, 'error');
      document.getElementById('config-rows').innerHTML = r.config.map(function (c) {
        return '<div class="bg-surface-container-lowest border border-outline-variant rounded p-md flex items-center gap-3 flex-wrap">' +
          '<div class="min-w-0 flex-1"><p class="text-label-md font-semibold">' + EF.esc(c.note || c.key) + '</p>' +
          '<p class="text-label-sm text-outline">' + EF.esc(c.key) + '</p></div>' +
          '<input data-cfg="' + EF.esc(c.key) + '" value="' + EF.esc(c.value) + '" class="h-10 px-3 w-56 rounded border border-outline-variant bg-surface text-label-md focus:border-secondary focus:outline-none">' +
          '<button data-save-cfg="' + EF.esc(c.key) + '" class="px-4 py-2 rounded-lg bg-primary-container text-on-primary text-label-sm">บันทึก</button></div>';
      }).join('');
    });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-save-cfg]');
    if (!b) return;
    var key = b.dataset.saveCfg;
    var input = document.querySelector('[data-cfg="' + key + '"]');
    EF.api.post('admin.config', { key: key, value: input.value })
      .then(function (r) { EF.toast(r.ok ? 'บันทึกแล้ว' : r.error, r.ok ? 'info' : 'error'); });
  });

  loadStats();
  loadQueue();
})();
</script>
</body>
</html>
