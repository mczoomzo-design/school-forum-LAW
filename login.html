<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ — EduForum</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/config.js"></script>
<style>body { font-family: 'Sarabun', 'Be Vietnam Pro', sans-serif; }</style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">

<div id="site-header"></div>

<main class="flex-1 flex items-center justify-center px-5 py-xl">
  <div class="w-full max-w-md page-enter">

    <div class="text-center mb-lg">
      <span class="inline-flex size-14 rounded-xl bg-primary items-center justify-center font-display text-headline-md text-on-primary mb-3" aria-hidden="true">E</span>
      <h1 id="site-title" class="font-display text-headline-md text-on-surface">ยินดีต้อนรับ</h1>
      <p class="text-body-md text-on-surface-variant">พื้นที่ถาม-ตอบและพูดคุยของโรงเรียน</p>
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg">
      <div class="relative flex mb-lg bg-surface-container rounded-lg p-1">
        <span id="tab-slider" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] rounded bg-surface-container-lowest shadow-sm transition-transform duration-200" style="transition-timing-function:cubic-bezier(.16,1,.3,1)"></span>
        <button id="tab-login" class="relative flex-1 py-2.5 text-label-md z-10 text-primary font-semibold">เข้าสู่ระบบ</button>
        <button id="tab-register" class="relative flex-1 py-2.5 text-label-md z-10 text-on-surface-variant">สมัครสมาชิก</button>
      </div>

      <div id="form-login" class="flex flex-col gap-md">
        <div>
          <label for="lg-user" class="block text-label-md text-on-surface-variant mb-1">ชื่อผู้ใช้</label>
          <input id="lg-user" autocomplete="username" class="w-full h-12 px-3 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none">
        </div>
        <div>
          <label for="lg-pass" class="block text-label-md text-on-surface-variant mb-1">รหัสผ่าน</label>
          <div class="relative">
            <input id="lg-pass" type="password" autocomplete="current-password" class="w-full h-12 px-3 pr-11 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none">
            <button type="button" data-toggle="lg-pass" class="btn absolute right-1 top-1 size-10 rounded text-on-surface-variant hover:bg-surface-container" aria-label="แสดงรหัสผ่าน">
              <span class="material-symbols-outlined text-[20px]">visibility</span></button>
          </div>
        </div>
        <button id="btn-login" class="btn h-12 rounded-lg bg-primary-container text-on-primary text-label-md hover:opacity-90 disabled:opacity-50">เข้าสู่ระบบ</button>
        <a href="index.html" class="text-center text-label-md text-secondary hover:underline min-h-11 flex items-center justify-center">ใช้งานแบบผู้เยี่ยมชม</a>
      </div>

      <div id="form-register" class="hidden flex-col gap-md">
        <div>
          <label for="rg-user" class="block text-label-md text-on-surface-variant mb-1">ชื่อผู้ใช้</label>
          <input id="rg-user" autocomplete="username" placeholder="a-z 0-9 จุด ขีดล่าง ยาว 4-20 ตัว" class="w-full h-12 px-3 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none">
          <p class="text-label-sm text-outline mt-1">ตั้งแล้วเปลี่ยนไม่ได้ ใช้เป็นชื่อเข้าสู่ระบบ</p>
        </div>
        <div>
          <label for="rg-name" class="block text-label-md text-on-surface-variant mb-1">ชื่อที่จะแสดง</label>
          <input id="rg-name" placeholder="ชื่อที่เพื่อน ๆ จะเห็น (เปลี่ยนได้ภายหลัง)" class="w-full h-12 px-3 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none">
        </div>
        <div>
          <span class="block text-label-md text-on-surface-variant mb-1">สถานะ</span>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" data-role="student" class="role-opt btn py-3 min-h-11 rounded border border-secondary bg-secondary-container text-label-md" aria-pressed="true">นักเรียน</button>
            <button type="button" data-role="teacher" class="role-opt btn py-3 min-h-11 rounded border border-outline-variant text-label-md" aria-pressed="false">ครู / บุคลากร</button>
          </div>
        </div>
        <div>
          <label for="rg-pass" class="block text-label-md text-on-surface-variant mb-1">รหัสผ่าน</label>
          <input id="rg-pass" type="password" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร" class="w-full h-12 px-3 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none">
        </div>
        <button id="btn-register" class="btn h-12 rounded-lg bg-secondary text-on-secondary text-label-md hover:opacity-90 disabled:opacity-50">สมัครสมาชิก</button>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/app.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
  UI.renderHeader('');
  UI.renderFooter();
  UI.bootstrap().then(function () { UI.renderHeader(''); UI.renderFooter(); });

  var next = EF.param('next') || 'index.html';
  var role = 'student';

  var tabL = document.getElementById('tab-login'), tabR = document.getElementById('tab-register');
  var fL = document.getElementById('form-login'), fR = document.getElementById('form-register');
  var slider = document.getElementById('tab-slider');

  function show(which) {
    var login = which === 'login';
    slider.style.transform = login ? 'translateX(0)' : 'translateX(100%)';
    tabL.className = 'relative flex-1 py-2.5 text-label-md z-10 ' + (login ? 'text-primary font-semibold' : 'text-on-surface-variant');
    tabR.className = 'relative flex-1 py-2.5 text-label-md z-10 ' + (login ? 'text-on-surface-variant' : 'text-primary font-semibold');
    fL.className = login ? 'flex flex-col gap-md' : 'hidden';
    fR.className = login ? 'hidden' : 'flex flex-col gap-md';
  }
  tabL.addEventListener('click', function () { show('login'); });
  tabR.addEventListener('click', function () { show('register'); });

  // ปุ่มเลือกสถานะ
  document.querySelectorAll('.role-opt').forEach(function (b) {
    b.addEventListener('click', function () {
      role = b.dataset.role;
      document.querySelectorAll('.role-opt').forEach(function (x) {
        var on = x === b;
        x.classList.toggle('border-secondary', on);
        x.classList.toggle('bg-secondary-container', on);
        x.classList.toggle('border-outline-variant', !on);
        x.setAttribute('aria-pressed', on);
      });
    });
  });

  // ปุ่มแสดง/ซ่อนรหัสผ่าน
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-toggle]');
    if (!t) return;
    var input = document.getElementById(t.dataset.toggle);
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    t.querySelector('.material-symbols-outlined').textContent = show ? 'visibility_off' : 'visibility';
  });

  function done(r, btn, label) {
    btn.disabled = false; btn.textContent = label;
    if (!r.ok) return UI.toast(r.error, 'error');
    EF.Auth.save(r.token, r.user);
    UI.toast('ยินดีต้อนรับ ' + r.user.displayName, 'success');
    setTimeout(function () {
      location.href = r.user.role === 'admin' ? 'admin.html' : next;
    }, 500);
  }

  var bL = document.getElementById('btn-login');
  bL.addEventListener('click', function () {
    var u = document.getElementById('lg-user').value.trim();
    var p = document.getElementById('lg-pass').value;
    if (!u || !p) return UI.toast('กรอกชื่อผู้ใช้และรหัสผ่าน', 'warn');
    bL.disabled = true; bL.textContent = 'กำลังตรวจสอบ…';
    EF.api.post('login', { username: u, password: p })
      .then(function (r) { done(r, bL, 'เข้าสู่ระบบ'); })
      .catch(function (e) { bL.disabled = false; bL.textContent = 'เข้าสู่ระบบ'; UI.toast(e.message, 'error'); });
  });

  var bR = document.getElementById('btn-register');
  bR.addEventListener('click', function () {
    var u = document.getElementById('rg-user').value.trim();
    var p = document.getElementById('rg-pass').value;
    if (!u || !p) return UI.toast('กรอกข้อมูลให้ครบ', 'warn');
    bR.disabled = true; bR.textContent = 'กำลังสมัคร…';
    EF.api.post('register', {
      username: u, password: p,
      displayName: document.getElementById('rg-name').value.trim(), role: role
    }).then(function (r) { done(r, bR, 'สมัครสมาชิก'); })
      .catch(function (e) { bR.disabled = false; bR.textContent = 'สมัครสมาชิก'; UI.toast(e.message, 'error'); });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (fL.className.indexOf('hidden') === -1) bL.click(); else bR.click();
  });
})();
</script>
</body>
</html>
