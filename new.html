<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สร้างกระทู้ใหม่ — EduForum</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/config.js"></script>
<style>
  body { font-family: 'Sarabun', 'Be Vietnam Pro', sans-serif; }
  :focus-visible { outline: 2px solid #006a6a; outline-offset: 2px; }
</style>
</head>
<body class="bg-surface text-on-surface">

<div id="site-header"></div>

<main class="max-w-3xl mx-auto px-5 py-lg">
  <h1 class="font-display text-headline-lg mb-lg">สร้างกระทู้ใหม่</h1>

  <div class="bg-surface-container-lowest border border-outline-variant rounded p-lg flex flex-col gap-lg">

    <div id="guest-name-box" class="hidden">
      <label for="guest-name" class="block text-label-md text-on-surface-variant mb-1">ชื่อที่จะแสดง</label>
      <input id="guest-name" maxlength="40" placeholder="เช่น นักเรียน ม.4/1"
             class="w-full h-12 px-3 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none">
      <p class="text-label-sm text-outline mt-1">โพสต์แบบผู้เยี่ยมชม หรือ <a href="login.html" class="text-secondary underline">เข้าสู่ระบบ</a> เพื่อแก้ไขและติดตามกระทู้ของตัวเองได้</p>
    </div>

    <div>
      <label for="title" class="block text-label-md text-on-surface-variant mb-1">หัวข้อกระทู้</label>
      <input id="title" maxlength="120" placeholder="ตั้งหัวข้อให้ชัดเจน คนอ่านจะเข้ามาช่วยตอบง่ายขึ้น"
             class="w-full h-12 px-3 rounded border border-outline-variant bg-surface text-body-lg focus:border-secondary focus:outline-none">
      <p class="text-label-sm text-outline mt-1"><span id="title-count">0</span>/120</p>
    </div>

    <div>
      <label for="category" class="block text-label-md text-on-surface-variant mb-1">หมวดหมู่</label>
      <select id="category" class="w-full h-12 px-3 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none">
        <option value="">กำลังโหลดหมวดหมู่…</option>
      </select>
    </div>

    <div>
      <label for="body" class="block text-label-md text-on-surface-variant mb-1">เนื้อหา</label>
      <textarea id="body" rows="12" placeholder="เล่ารายละเอียด สิ่งที่ลองมาแล้ว และสิ่งที่อยากรู้"
                class="w-full p-3 rounded border border-outline-variant bg-surface text-body-md leading-7 focus:border-secondary focus:outline-none"></textarea>
    </div>

    <div>
      <label for="tags" class="block text-label-md text-on-surface-variant mb-1">แท็ก (ไม่เกิน 5 คำ คั่นด้วยจุลภาค)</label>
      <input id="tags" placeholder="ฟิสิกส์, ม.5, การบ้าน"
             class="w-full h-12 px-3 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none">
    </div>

    <div class="bg-surface-container-low rounded p-md text-label-md text-on-surface-variant">
      <p class="font-semibold text-on-surface mb-1">ก่อนโพสต์</p>
      <p>ใช้ถ้อยคำสุภาพ ไม่พาดพิงบุคคลในทางเสียหาย ไม่เปิดเผยข้อมูลส่วนตัวของผู้อื่น เช่น เลขประจำตัวประชาชน เบอร์โทร หรือที่อยู่</p>
    </div>

    <div class="flex items-center justify-end gap-3">
      <a href="index.html" class="px-5 py-3 rounded-lg text-label-md text-on-surface-variant hover:text-primary">ยกเลิก</a>
      <button id="btn-post" class="px-6 py-3 rounded-lg bg-secondary text-on-secondary text-label-md hover:opacity-90 disabled:opacity-50">
        เผยแพร่กระทู้
      </button>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/app.js"></script>
<script>
(function () {
  EF.renderHeader('browse'); EF.renderFooter();

  document.getElementById('title').addEventListener('input', function (e) {
    document.getElementById('title-count').textContent = e.target.value.length;
  });

  EF.api.get('bootstrap').then(function (r) {
    if (!r.ok) return EF.toast(r.error, 'error');
    var sel = document.getElementById('category');
    sel.innerHTML = '<option value="">เลือกหมวดหมู่</option>' +
      r.categories.map(function (c) { return '<option value="' + c.id + '">' + EF.esc(c.name) + '</option>'; }).join('');
    var pre = EF.param('category');
    if (pre) sel.value = pre;

    if (!EF.Auth.isLoggedIn()) {
      if (r.config.allowGuestThread) {
        document.getElementById('guest-name-box').classList.remove('hidden');
      } else {
        EF.toast('ต้องเข้าสู่ระบบก่อนตั้งกระทู้', 'warn');
        setTimeout(function () { location.href = 'login.html?next=new.html'; }, 1200);
      }
    }
  }).catch(function (e) { EF.toast(e.message, 'error'); });

  var btn = document.getElementById('btn-post');
  btn.addEventListener('click', function () {
    var title = document.getElementById('title').value.trim();
    var body = document.getElementById('body').value.trim();
    var categoryId = document.getElementById('category').value;
    if (title.length < 5) return EF.toast('หัวข้อสั้นเกินไป (อย่างน้อย 5 ตัวอักษร)', 'warn');
    if (!categoryId) return EF.toast('เลือกหมวดหมู่ก่อน', 'warn');
    if (body.length < 10) return EF.toast('เนื้อหาสั้นเกินไป (อย่างน้อย 10 ตัวอักษร)', 'warn');

    btn.disabled = true; btn.textContent = 'กำลังเผยแพร่…';
    EF.api.post('createThread', {
      title: title, body: body, categoryId: categoryId,
      tags: document.getElementById('tags').value,
      guestName: (document.getElementById('guest-name') || {}).value || ''
    }).then(function (r) {
      if (!r.ok) { btn.disabled = false; btn.textContent = 'เผยแพร่กระทู้'; return EF.toast(r.error, 'error'); }
      if (r.pending) {
        EF.toast('ส่งกระทู้แล้ว รอผู้ดูแลอนุมัติก่อนแสดงผล');
        setTimeout(function () { location.href = 'index.html'; }, 1600);
      } else {
        location.href = 'thread.html?id=' + encodeURIComponent(r.id);
      }
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = 'เผยแพร่กระทู้';
      EF.toast(e.message, 'error');
    });
  });
})();
</script>
</body>
</html>
