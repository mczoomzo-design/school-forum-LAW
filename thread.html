<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หัวข้อการสนทนา — EduForum</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/config.js"></script>
<style>body { font-family: 'Sarabun', 'Be Vietnam Pro', sans-serif; }</style>
</head>
<body class="bg-surface text-on-surface">

<div id="site-header"></div>

<main class="max-w-3xl mx-auto px-5 py-lg page-enter">
  <a href="index.html" class="btn inline-flex items-center gap-1 min-h-11 text-label-md text-on-surface-variant hover:text-secondary mb-md">
    <span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_back</span> กลับหน้าฟีด
  </a>

  <div id="thread-box"></div>

  <section class="mt-lg">
    <h2 id="reply-title" class="font-display text-headline-md mb-md">ความคิดเห็น</h2>
    <div id="reply-list" class="flex flex-col gap-3"></div>
  </section>

  <section id="composer" class="mt-lg bg-surface-container-lowest border border-outline-variant rounded p-md scroll-mt-20">
    <h3 class="font-display text-title-lg mb-md">ร่วมแสดงความคิดเห็น</h3>
    <div id="guest-name-box" class="mb-3 hidden">
      <label for="guest-name" class="block text-label-md text-on-surface-variant mb-1">ชื่อที่จะแสดง</label>
      <input id="guest-name" maxlength="40" placeholder="เช่น นักเรียน ม.5/2"
             class="w-full h-12 px-3 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none">
    </div>
    <label for="reply-body" class="sr-only">ความคิดเห็นของคุณ</label>
    <textarea id="reply-body" rows="4" placeholder="พิมพ์ความคิดเห็นของคุณ ใช้ถ้อยคำสุภาพและให้เกียรติกัน"
              class="w-full p-3 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none"></textarea>
    <div class="flex items-center justify-between mt-3 gap-3 flex-wrap">
      <p id="composer-note" class="text-label-sm text-outline"></p>
      <button id="btn-reply" class="btn px-5 py-3 min-h-11 rounded-lg bg-primary-container text-on-primary text-label-md hover:opacity-90 disabled:opacity-50">
        ส่งความคิดเห็น
      </button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/app.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
  var id = EF.param('id');
  var current = null;

  UI.renderHeader('browse');
  UI.renderFooter();
  UI.readProgress();
  UI.bootstrap().then(setupComposer);

  if (!id) showNotFound(); else load();

  function showNotFound() {
    document.getElementById('thread-box').innerHTML =
      UI.emptyState('ไม่พบกระทู้นี้', 'อาจถูกนำออกไปแล้ว หรือลิงก์ไม่ถูกต้อง', 'กลับหน้าฟีด', 'index.html');
  }

  function load() {
    document.getElementById('thread-box').innerHTML = UI.skeletonList(1);
    EF.api.get('thread', { id: id }).then(function (r) {
      if (!r.ok) return showNotFound();
      current = r.thread;
      renderThread(r.thread);
      renderReplies(r.replies);
      document.getElementById('reply-title').textContent = 'ความคิดเห็น (' + r.replies.length + ')';
      if (r.thread.locked) {
        document.getElementById('composer').innerHTML =
          '<p class="text-body-md text-on-surface-variant text-center py-3">กระทู้นี้ถูกล็อกการตอบโดยผู้ดูแลระบบ</p>';
      }
      UI.reveal();
    }).catch(function (e) { UI.toast(e.message, 'error'); });
  }

  function authorLink(t) {
    return t.authorUsername
      ? '<a href="profile.html?u=' + encodeURIComponent(t.authorUsername) + '" class="text-label-md text-on-surface hover:text-secondary hover:underline">' + EF.esc(t.authorName) + '</a>'
      : '<span class="text-label-md text-on-surface">' + EF.esc(t.authorName) + '</span>';
  }

  function renderThread(t) {
    document.title = t.title + ' — EduForum';
    document.getElementById('thread-box').innerHTML =
      '<article class="bg-surface-container-lowest border border-outline-variant rounded p-lg">' +
        '<div class="flex items-center gap-2 mb-3 flex-wrap">' +
          EF.badge(t.categoryName, t.categoryColor) +
          (t.pinned ? EF.badge('ปักหมุด', '#b45309') : '') +
          (t.locked ? EF.badge('ล็อกการตอบ', '#ba1a1a') : '') +
          t.tags.map(function (g) { return EF.badge('#' + g, '#6b6c78'); }).join('') +
        '</div>' +
        '<h1 class="font-display text-headline-md text-on-surface mb-md break-words">' + EF.esc(t.title) + '</h1>' +
        '<div class="flex items-center gap-3 mb-lg pb-md border-b border-outline-variant">' +
          EF.avatar(t, 'lg') +
          '<div class="min-w-0"><div class="flex items-center gap-2 flex-wrap">' + authorLink(t) + EF.roleBadge(t.authorRole) +
            (t.isGuest ? '<span class="text-label-sm text-outline">ผู้เยี่ยมชม</span>' : '') + '</div>' +
            '<p class="text-label-sm text-outline">' + EF.timeAgo(t.createdAt) + ' · เปิดอ่าน ' + t.views + ' ครั้ง</p></div>' +
          (t.authorUsername ? '<button data-report-user="' + EF.esc(t.authorUsername) + '" class="btn ml-auto min-h-11 px-3 rounded-lg text-label-sm text-on-surface-variant hover:text-error hover:bg-surface-container">รายงานผู้ใช้</button>' : '') +
        '</div>' +
        '<div class="text-body-lg leading-8 text-on-surface break-words">' + EF.textToHtml(t.body) + '</div>' +
        '<div class="flex items-center gap-2 mt-lg pt-md border-t border-outline-variant flex-wrap">' +
          actionBtn('like', 'favorite', t.likeCount + ' ถูกใจ', 'thread', t.id) +
          '<button id="btn-bookmark" class="btn flex items-center gap-2 px-4 min-h-11 rounded-lg border border-outline-variant text-label-md hover:border-secondary ' +
            (t.bookmarked ? 'text-secondary border-secondary' : '') + '">' +
            '<span class="material-symbols-outlined text-[18px]" aria-hidden="true">bookmark</span>' +
            '<span id="bookmark-label">' + (t.bookmarked ? 'บันทึกแล้ว' : 'บันทึกไว้อ่าน') + '</span></button>' +
          '<button id="btn-share" class="btn flex items-center gap-2 px-4 min-h-11 rounded-lg text-label-md text-on-surface-variant hover:text-primary">' +
            '<span class="material-symbols-outlined text-[18px]" aria-hidden="true">share</span> แชร์</button>' +
          '<button data-report="thread" data-id="' + t.id + '" class="btn flex items-center gap-2 px-4 min-h-11 rounded-lg text-label-md text-on-surface-variant hover:text-error ml-auto">' +
            '<span class="material-symbols-outlined text-[18px]" aria-hidden="true">flag</span> รายงานกระทู้</button>' +
        '</div>' +
      '</article>';
  }

  function actionBtn(kind, icon, label, type, tid) {
    return '<button data-like="' + type + '" data-id="' + tid + '" class="btn flex items-center gap-2 px-4 min-h-11 rounded-lg border border-outline-variant text-label-md hover:border-secondary hover:text-secondary">' +
      '<span class="material-symbols-outlined text-[18px]" aria-hidden="true">' + icon + '</span>' +
      '<span class="like-count">' + label + '</span></button>';
  }

  function renderReplies(list) {
    var box = document.getElementById('reply-list');
    if (!list.length) {
      box.innerHTML = '<p class="text-body-md text-on-surface-variant bg-surface-container-lowest border border-dashed border-outline-variant rounded p-lg text-center">ยังไม่มีความคิดเห็น เป็นคนแรกที่ตอบกระทู้นี้</p>';
      return;
    }
    box.innerHTML = list.map(function (r, i) {
      return '<article class="reveal bg-surface-container-lowest border border-outline-variant rounded p-md">' +
        '<div class="flex gap-3">' + EF.avatar(r, 'md') +
          '<div class="min-w-0 flex-1">' +
            '<div class="flex items-center gap-2 flex-wrap">' +
              authorLink(r) + EF.roleBadge(r.authorRole) +
              (r.isGuest ? '<span class="text-label-sm text-outline">ผู้เยี่ยมชม</span>' : '') +
              '<span class="text-label-sm text-outline">· ' + EF.timeAgo(r.createdAt) + '</span>' +
              '<span class="text-label-sm text-outline ml-auto">ความเห็นที่ ' + (i + 1) + '</span>' +
            '</div>' +
            '<div class="text-body-md text-on-surface mt-2 break-words">' + EF.textToHtml(r.body) + '</div>' +
            '<div class="flex items-center gap-1 mt-2 flex-wrap">' +
              '<button data-like="reply" data-id="' + r.id + '" class="btn flex items-center gap-1 px-3 min-h-11 rounded-lg text-label-sm text-on-surface-variant hover:text-secondary">' +
                '<span class="material-symbols-outlined text-[16px]" aria-hidden="true">favorite</span><span class="like-count">' + r.likeCount + '</span>' +
                '<span class="sr-only">ถูกใจความคิดเห็นนี้</span></button>' +
              '<button data-quote="' + EF.esc(r.authorName) + '" class="btn px-3 min-h-11 rounded-lg text-label-sm text-on-surface-variant hover:text-secondary">ตอบกลับ</button>' +
              '<button data-report="reply" data-id="' + r.id + '" class="btn px-3 min-h-11 rounded-lg text-label-sm text-on-surface-variant hover:text-error">รายงาน</button>' +
              (r.authorUsername ? '<button data-report-user="' + EF.esc(r.authorUsername) + '" class="btn px-3 min-h-11 rounded-lg text-label-sm text-on-surface-variant hover:text-error">รายงานผู้ใช้</button>' : '') +
            '</div>' +
          '</div>' +
        '</div></article>';
    }).join('');
  }

  // ---- การกระทำต่าง ๆ ----
  document.addEventListener('click', function (e) {
    var likeBtn = e.target.closest('[data-like]');
    if (likeBtn) {
      var icon = likeBtn.querySelector('.material-symbols-outlined');
      EF.api.post('like', { targetType: likeBtn.dataset.like, targetId: likeBtn.dataset.id })
        .then(function (r) {
          if (!r.ok) return UI.toast(r.error, 'error');
          var span = likeBtn.querySelector('.like-count');
          span.textContent = likeBtn.dataset.like === 'thread' ? (r.likeCount + ' ถูกใจ') : r.likeCount;
          likeBtn.classList.toggle('text-secondary', r.liked);
          if (icon && r.liked) {
            icon.classList.remove('like-pop');
            void icon.offsetWidth;
            icon.classList.add('like-pop');
          }
        });
      return;
    }

    var rep = e.target.closest('[data-report]');
    if (rep) { UI.reportDialog(rep.dataset.report, rep.dataset.id, current ? current.title : ''); return; }

    var repUser = e.target.closest('[data-report-user]');
    if (repUser) { UI.reportDialog('user', repUser.dataset.reportUser, '@' + repUser.dataset.reportUser); return; }

    var quote = e.target.closest('[data-quote]');
    if (quote) {
      var ta = document.getElementById('reply-body');
      if (!ta) return;
      ta.value = '@' + quote.dataset.quote + ' ' + ta.value;
      document.getElementById('composer').scrollIntoView({ behavior: 'smooth', block: 'center' });
      ta.focus();
      return;
    }

    if (e.target.closest('#btn-share')) {
      var url = location.href;
      if (navigator.share) { navigator.share({ title: current ? current.title : 'EduForum', url: url }).catch(function () {}); return; }
      navigator.clipboard.writeText(url)
        .then(function () { UI.toast('คัดลอกลิงก์กระทู้แล้ว', 'success'); })
        .catch(function () { UI.toast('คัดลอกลิงก์ไม่สำเร็จ', 'error'); });
      return;
    }

    var bm = e.target.closest('#btn-bookmark');
    if (bm) {
      if (!EF.Auth.isLoggedIn()) { UI.toast('เข้าสู่ระบบก่อนจึงจะบันทึกกระทู้ได้', 'warn'); return; }
      EF.api.post('bookmark', { threadId: id }).then(function (r) {
        if (!r.ok) return UI.toast(r.error, 'error');
        document.getElementById('bookmark-label').textContent = r.bookmarked ? 'บันทึกแล้ว' : 'บันทึกไว้อ่าน';
        bm.classList.toggle('text-secondary', r.bookmarked);
        bm.classList.toggle('border-secondary', r.bookmarked);
        UI.toast(r.bookmarked ? 'บันทึกกระทู้ไว้อ่านทีหลังแล้ว' : 'นำออกจากรายการบันทึกแล้ว', 'success');
      });
    }
  });

  // ---- กล่องตอบ ----
  function setupComposer(r) {
    if (!r || !r.ok) return;
    var note = document.getElementById('composer-note');
    if (EF.Auth.isLoggedIn()) {
      note.textContent = 'ตอบในชื่อ ' + EF.Auth.user.displayName;
    } else if (r.config.allowGuestReply) {
      document.getElementById('guest-name-box').classList.remove('hidden');
      note.innerHTML = 'ตอบแบบผู้เยี่ยมชม หรือ <a href="login.html" class="text-secondary underline">เข้าสู่ระบบ</a> เพื่อสะสมโพสต์และรับแจ้งเตือน';
    } else {
      document.getElementById('composer').innerHTML =
        '<p class="text-body-md text-center py-3">ต้องเข้าสู่ระบบก่อนจึงจะตอบกระทู้ได้ <a href="login.html" class="text-secondary underline">เข้าสู่ระบบ</a></p>';
    }
  }

  var btn = document.getElementById('btn-reply');
  btn.addEventListener('click', function () {
    var ta = document.getElementById('reply-body');
    var body = ta.value.trim();
    if (body.length < 2) { UI.toast('พิมพ์ข้อความก่อนส่ง', 'warn'); ta.focus(); return; }

    btn.disabled = true; btn.textContent = 'กำลังส่ง…';
    EF.api.post('createReply', {
      threadId: id, body: body,
      guestName: (document.getElementById('guest-name') || {}).value || ''
    }).then(function (r) {
      btn.disabled = false; btn.textContent = 'ส่งความคิดเห็น';
      if (!r.ok) return UI.toast(r.error, 'error');
      ta.value = '';
      UI.toast(r.pending ? 'ส่งแล้ว รอผู้ดูแลอนุมัติ' : 'ส่งความคิดเห็นแล้ว', 'success');
      if (!r.pending) load();
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = 'ส่งความคิดเห็น';
      UI.toast(e.message, 'error');
    });
  });

  // Ctrl+Enter เพื่อส่งความคิดเห็น
  document.getElementById('reply-body').addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') btn.click();
  });
})();
</script>
</body>
</html>
