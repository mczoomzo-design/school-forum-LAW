<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หัวข้อการสนทนา — EduForum</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/config.js"></script>
<style>
  body { font-family: 'Sarabun', 'Be Vietnam Pro', sans-serif; }
  :focus-visible { outline: 2px solid #006a6a; outline-offset: 2px; }
</style>
</head>
<body class="bg-surface text-on-surface">

<div id="site-header"></div>

<main class="max-w-container mx-auto px-5 py-lg">
  <a href="index.html" class="inline-flex items-center gap-1 text-label-md text-on-surface-variant hover:text-secondary mb-md">
    <span class="material-symbols-outlined text-[18px]">arrow_back</span> กลับหน้าฟีด
  </a>

  <div id="thread-box">
    <div class="animate-pulse bg-surface-container-lowest border border-outline-variant rounded p-lg h-48"></div>
  </div>

  <section class="mt-lg">
    <h2 id="reply-title" class="font-display text-headline-md mb-md">ความคิดเห็น</h2>
    <div id="reply-list" class="flex flex-col gap-3"></div>
  </section>

  <!-- กล่องตอบกระทู้ -->
  <section id="composer" class="mt-lg bg-surface-container-lowest border border-outline-variant rounded p-md">
    <h3 class="font-display text-title-lg mb-md">ร่วมแสดงความคิดเห็น</h3>
    <div id="guest-name-box" class="mb-3 hidden">
      <label class="block text-label-md text-on-surface-variant mb-1">ชื่อที่จะแสดง</label>
      <input id="guest-name" maxlength="40" placeholder="เช่น นักเรียน ม.5/2"
             class="w-full h-11 px-3 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none">
    </div>
    <textarea id="reply-body" rows="4" placeholder="พิมพ์ความคิดเห็นของคุณ… ใช้ถ้อยคำสุภาพและให้เกียรติกัน"
              class="w-full p-3 rounded border border-outline-variant bg-surface text-body-md focus:border-secondary focus:outline-none"></textarea>
    <div class="flex items-center justify-between mt-3 gap-3 flex-wrap">
      <p id="composer-note" class="text-label-sm text-outline"></p>
      <button id="btn-reply" class="px-5 py-3 rounded-lg bg-primary-container text-on-primary text-label-md hover:opacity-90 disabled:opacity-50">
        ส่งความคิดเห็น
      </button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/app.js"></script>
<script>
(function () {
  var id = EF.param('id');
  var data = null;
  EF.renderHeader('browse'); EF.renderFooter();

  if (!id) { document.getElementById('thread-box').innerHTML = notFound(); }
  else load();

  function notFound() {
    return '<div class="bg-surface-container-lowest border border-outline-variant rounded p-xl text-center">' +
      '<p class="text-body-lg mb-2">ไม่พบกระทู้นี้</p>' +
      '<p class="text-body-md text-on-surface-variant mb-md">อาจถูกลบไปแล้ว หรือลิงก์ไม่ถูกต้อง</p>' +
      '<a href="index.html" class="inline-block px-5 py-3 rounded-lg bg-secondary text-on-secondary text-label-md">กลับหน้าฟีด</a></div>';
  }

  function load() {
    EF.api.get('thread', { id: id }).then(function (r) {
      if (!r.ok) { document.getElementById('thread-box').innerHTML = notFound(); return; }
      data = r;
      renderThread(r.thread);
      renderReplies(r.replies);
      document.getElementById('reply-title').textContent = 'ความคิดเห็น (' + r.replies.length + ')';
      if (r.thread.locked) {
        document.getElementById('composer').innerHTML =
          '<p class="text-body-md text-on-surface-variant text-center py-2">กระทู้นี้ถูกล็อกการตอบโดยผู้ดูแลระบบ</p>';
      }
    }).catch(function (e) { EF.toast(e.message, 'error'); });
  }

  function renderThread(t) {
    document.title = t.title + ' — EduForum';
    document.getElementById('thread-box').innerHTML =
      '<article class="bg-surface-container-lowest border border-outline-variant rounded p-lg">' +
        '<div class="flex items-center gap-2 mb-3 flex-wrap">' +
          EF.badge(t.categoryName, t.categoryColor) +
          (t.pinned ? EF.badge('ปักหมุด', '#b45309') : '') +
          t.tags.map(function (g) { return EF.badge('#' + g, '#757682'); }).join('') +
        '</div>' +
        '<h1 class="font-display text-headline-md text-on-surface mb-md break-words">' + EF.esc(t.title) + '</h1>' +
        '<div class="flex items-center gap-3 mb-lg pb-md border-b border-outline-variant">' +
          EF.avatarHtml(t.authorName, t.isGuest, 'lg') +
          '<div><p class="text-label-md text-on-surface">' + EF.esc(t.authorName) +
            (t.isGuest ? ' <span class="text-outline">· ผู้เยี่ยมชม</span>' : '') + '</p>' +
            '<p class="text-label-sm text-outline">' + EF.timeAgo(t.createdAt) + ' · เปิดอ่าน ' + t.views + ' ครั้ง</p></div>' +
        '</div>' +
        '<div class="text-body-lg leading-8 text-on-surface whitespace-pre-line break-words">' + EF.textToHtml(t.body) + '</div>' +
        '<div class="flex items-center gap-3 mt-lg pt-md border-t border-outline-variant">' +
          '<button data-like="thread" data-id="' + t.id + '" class="flex items-center gap-2 px-4 py-2 rounded-lg border border-outline-variant text-label-md hover:border-secondary hover:text-secondary">' +
            '<span class="material-symbols-outlined text-[18px]">favorite</span><span class="like-count">' + t.likeCount + '</span> ถูกใจ</button>' +
          '<button id="btn-share" class="flex items-center gap-2 px-4 py-2 rounded-lg text-label-md text-on-surface-variant hover:text-primary">' +
            '<span class="material-symbols-outlined text-[18px]">share</span> แชร์</button>' +
          '<button data-report="thread" data-id="' + t.id + '" class="flex items-center gap-2 px-4 py-2 rounded-lg text-label-md text-on-surface-variant hover:text-error ml-auto">' +
            '<span class="material-symbols-outlined text-[18px]">flag</span> รายงาน</button>' +
        '</div>' +
      '</article>';
  }

  function renderReplies(list) {
    var box = document.getElementById('reply-list');
    if (!list.length) {
      box.innerHTML = '<p class="text-body-md text-on-surface-variant bg-surface-container-lowest border border-dashed border-outline-variant rounded p-lg text-center">ยังไม่มีความคิดเห็น เป็นคนแรกที่ตอบกระทู้นี้</p>';
      return;
    }
    box.innerHTML = list.map(function (r, i) {
      return '<article class="bg-surface-container-lowest border border-outline-variant rounded p-md">' +
        '<div class="flex gap-3">' + EF.avatarHtml(r.authorName, r.isGuest) +
          '<div class="min-w-0 flex-1">' +
            '<div class="flex items-center gap-2 flex-wrap">' +
              '<span class="text-label-md text-on-surface">' + EF.esc(r.authorName) + '</span>' +
              (r.isGuest ? '<span class="text-label-sm text-outline">ผู้เยี่ยมชม</span>' : '') +
              '<span class="text-label-sm text-outline">· ' + EF.timeAgo(r.createdAt) + '</span>' +
              '<span class="text-label-sm text-outline ml-auto">#' + (i + 1) + '</span>' +
            '</div>' +
            '<div class="text-body-md text-on-surface mt-2 whitespace-pre-line break-words">' + EF.textToHtml(r.body) + '</div>' +
            '<div class="flex items-center gap-2 mt-2">' +
              '<button data-like="reply" data-id="' + r.id + '" class="flex items-center gap-1 text-label-sm text-on-surface-variant hover:text-secondary">' +
                '<span class="material-symbols-outlined text-[16px]">favorite</span><span class="like-count">' + r.likeCount + '</span></button>' +
              '<button data-report="reply" data-id="' + r.id + '" class="text-label-sm text-on-surface-variant hover:text-error ml-2">รายงาน</button>' +
            '</div>' +
          '</div>' +
        '</div></article>';
    }).join('');
  }

  // ถูกใจ / รายงาน (ผูกเหตุการณ์ที่ระดับเอกสาร)
  document.addEventListener('click', function (e) {
    var likeBtn = e.target.closest('[data-like]');
    if (likeBtn) {
      EF.api.post('like', { targetType: likeBtn.dataset.like, targetId: likeBtn.dataset.id })
        .then(function (r) {
          if (!r.ok) return EF.toast(r.error, 'error');
          likeBtn.querySelector('.like-count').textContent = r.likeCount;
          likeBtn.classList.toggle('text-secondary', r.liked);
        });
      return;
    }
    var repBtn = e.target.closest('[data-report]');
    if (repBtn) {
      var reason = prompt('แจ้งเหตุผลที่รายงานเนื้อหานี้ (เช่น คำหยาบ, สแปม, ข้อมูลเท็จ)');
      if (!reason) return;
      EF.api.post('report', { targetType: repBtn.dataset.report, targetId: repBtn.dataset.id, reason: reason })
        .then(function (r) { EF.toast(r.ok ? r.message : r.error, r.ok ? 'info' : 'error'); });
      return;
    }
    if (e.target.closest('#btn-share')) {
      navigator.clipboard.writeText(location.href)
        .then(function () { EF.toast('คัดลอกลิงก์กระทู้แล้ว'); })
        .catch(function () { EF.toast('คัดลอกลิงก์ไม่สำเร็จ', 'error'); });
    }
  });

  // กล่องตอบ: โหมดสมาชิก vs ผู้เยี่ยมชม
  EF.api.get('bootstrap').then(function (r) {
    if (!r.ok) return;
    var note = document.getElementById('composer-note');
    if (EF.Auth.isLoggedIn()) {
      note.textContent = 'ตอบในชื่อ ' + EF.Auth.user.displayName;
    } else if (r.config.allowGuestReply) {
      document.getElementById('guest-name-box').classList.remove('hidden');
      note.innerHTML = 'ตอบแบบผู้เยี่ยมชม หรือ <a href="login.html" class="text-secondary underline">เข้าสู่ระบบ</a> เพื่อสะสมโพสต์';
    } else {
      document.getElementById('composer').innerHTML =
        '<p class="text-body-md text-center py-2">ต้องเข้าสู่ระบบก่อนจึงจะตอบกระทู้ได้ <a href="login.html" class="text-secondary underline">เข้าสู่ระบบ</a></p>';
    }
  });

  var btn = document.getElementById('btn-reply');
  if (btn) btn.addEventListener('click', function () {
    var body = document.getElementById('reply-body').value.trim();
    if (body.length < 2) return EF.toast('พิมพ์ข้อความก่อนส่ง', 'warn');
    btn.disabled = true;
    EF.api.post('createReply', {
      threadId: id, body: body,
      guestName: (document.getElementById('guest-name') || {}).value || ''
    }).then(function (r) {
      btn.disabled = false;
      if (!r.ok) return EF.toast(r.error, 'error');
      document.getElementById('reply-body').value = '';
      EF.toast(r.pending ? 'ส่งแล้ว รอผู้ดูแลอนุมัติ' : 'ส่งความคิดเห็นแล้ว');
      if (!r.pending) load();
    }).catch(function (e) { btn.disabled = false; EF.toast(e.message, 'error'); });
  });
})();
</script>
</body>
</html>
